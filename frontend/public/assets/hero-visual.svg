<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 560 560" width="560" height="560" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Aplicativo e painel web Farbo mostrando a localização de uma moto em tempo real</title>
  <style>
    .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .pulse.delay { animation-delay: 1.2s; }
    @keyframes pulse {
      from { transform: scale(0.5); opacity: 0.7; }
      to { transform: scale(1.7); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b322d"/>
      <stop offset="1" stop-color="#0c100d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="14" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="dashClip"><rect x="176" y="140" width="368" height="312" rx="16"/></clipPath>
    <clipPath id="screenClip"><rect x="32" y="72" width="220" height="484" rx="32"/></clipPath>

    <symbol id="moto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="16" r="3.5"/>
      <circle cx="19" cy="16" r="3.5"/>
      <path d="M5 16l4.5-6h5.5l4 6"/>
      <path d="M15 10l-1-4h3"/>
      <path d="M8 9h4"/>
    </symbol>
    <symbol id="car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
      <circle cx="7" cy="17" r="2"/>
      <path d="M9 17h6"/>
      <circle cx="17" cy="17" r="2"/>
    </symbol>
    <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
      <circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </symbol>
  </defs>

  <!-- Painel web -->
  <g filter="url(#shadow)">
    <rect x="176" y="140" width="368" height="312" rx="16" fill="#0d130e"/>
  </g>
  <g clip-path="url(#dashClip)">
    <rect x="176" y="140" width="368" height="30" fill="#111913"/>
    <line x1="176" y1="170.5" x2="544" y2="170.5" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="272" y="148" width="168" height="15" rx="7.5" fill="#0b110d"/>
    <text x="284" y="158.6" font-size="7.5" fill="#64748b">app.farborastreadores.com.br</text>
    <circle cx="512" cy="155.5" r="3" fill="#2a342d"/>
    <circle cx="524" cy="155.5" r="3" fill="#2a342d"/>

    <!-- Mapa do painel -->
    <rect x="176" y="171" width="224" height="281" fill="#0b120d"/>
    <rect x="346" y="236" width="26" height="44" rx="6" fill="#3be558" fill-opacity="0.08"/>
    <g fill="none" stroke="#16201a" stroke-width="4" stroke-linecap="round">
      <path d="M176 230H400"/>
      <path d="M176 400c84-10 154 10 224-5"/>
      <path d="M340 171v281"/>
      <path d="M280 171c5 89-10 179-2 281"/>
    </g>
    <g fill="none" stroke="#1e2a22" stroke-width="8" stroke-linecap="round">
      <path d="M176 300c84-10 154 20 224-10"/>
      <path d="M310 171c-10 80 20 180 8 281"/>
      <path d="M380 171c-8 89 12 189 4 281"/>
    </g>
    <path d="M322 452c4-42 8-82 2-134 20-6 38-12 58-22-2-26-4-56-6-82" fill="none" stroke="#3be558" stroke-width="8" stroke-opacity="0.25" filter="url(#glow)"/>
    <path d="M322 452c4-42 8-82 2-134 20-6 38-12 58-22-2-26-4-56-6-82" fill="none" stroke="#3be558" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="286" cy="262" r="5.5" fill="#e2e8f0" stroke="#0b120d" stroke-width="2"/>
    <circle cx="350" cy="382" r="5.5" fill="#3be558" stroke="#0b120d" stroke-width="2"/>
    <circle cx="290" cy="410" r="5.5" fill="#64748b" stroke="#0b120d" stroke-width="2"/>
    <circle cx="364" cy="430" r="5.5" fill="#3be558" stroke="#0b120d" stroke-width="2"/>
    <circle class="pulse" cx="376" cy="214" r="14" fill="#3be558" fill-opacity="0.3"/>
    <circle cx="376" cy="214" r="7" fill="#3be558" stroke="#0b120d" stroke-width="2"/>

    <!-- Lista de veículos -->
    <rect x="400" y="171" width="144" height="281" fill="#0f1712"/>
    <line x1="400.5" y1="171" x2="400.5" y2="452" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="412" y="192" font-size="10.5" font-weight="700" fill="#ffffff">Veículos</text>
    <rect x="488" y="182" width="46" height="15" rx="7.5" fill="#3be558" fill-opacity="0.12"/>
    <text x="511" y="192.5" font-size="7.5" font-weight="700" fill="#3be558" text-anchor="middle">4 online</text>

    <rect x="406" y="204" width="132" height="42" rx="9" fill="#3be558" fill-opacity="0.08" stroke="#3be558" stroke-opacity="0.25"/>
    <circle cx="424" cy="225" r="12" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.08"/>
    <use href="#moto" x="417" y="218" width="14" height="14" color="#3be558"/>
    <text x="443" y="222" font-size="9.5" font-weight="700" fill="#ffffff">Honda CB 500</text>
    <text x="443" y="235" font-size="7.5" fill="#3be558">Online · 80 km/h</text>

    <circle cx="424" cy="273" r="12" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.08"/>
    <use href="#car" x="417" y="266" width="14" height="14" color="#e2e8f0"/>
    <text x="443" y="270" font-size="9.5" font-weight="700" fill="#ffffff">Civic</text>
    <text x="443" y="283" font-size="7.5" fill="#3be558">Online · 0 km/h</text>

    <circle cx="424" cy="321" r="12" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.08"/>
    <use href="#car" x="417" y="314" width="14" height="14" color="#e2e8f0"/>
    <text x="443" y="318" font-size="9.5" font-weight="700" fill="#ffffff">T-Cross</text>
    <text x="443" y="331" font-size="7.5" fill="#3be558">Online · 62 km/h</text>

    <circle cx="424" cy="369" r="12" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.08"/>
    <use href="#car" x="417" y="362" width="14" height="14" color="#64748b"/>
    <text x="443" y="366" font-size="9.5" font-weight="700" fill="#ffffff">Fiorino</text>
    <text x="443" y="379" font-size="7.5" fill="#64748b">Offline · há 2h</text>

    <circle cx="424" cy="417" r="12" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.08"/>
    <use href="#car" x="417" y="410" width="14" height="14" color="#e2e8f0"/>
    <text x="443" y="414" font-size="9.5" font-weight="700" fill="#ffffff">Renegade</text>
    <text x="443" y="427" font-size="7.5" fill="#3be558">Online · 45 km/h</text>
  </g>
  <rect x="176.5" y="140.5" width="367" height="311" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Celular -->
  <g filter="url(#shadow)">
    <rect x="24" y="64" width="236" height="500" rx="40" fill="url(#phoneBody)"/>
  </g>
  <rect x="24.75" y="64.75" width="234.5" height="498.5" rx="39.25" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <rect x="21" y="150" width="3" height="34" rx="1.5" fill="#2a302c"/>
  <rect x="21" y="196" width="3" height="50" rx="1.5" fill="#2a302c"/>
  <rect x="260" y="180" width="3" height="64" rx="1.5" fill="#2a302c"/>
  <rect x="32" y="72" width="220" height="484" rx="32" fill="#0b110d"/>

  <g clip-path="url(#screenClip)">
    <!-- Barra de status -->
    <text x="56" y="95" font-size="11" font-weight="600" fill="#ffffff">14:32</text>
    <rect x="112" y="82" width="60" height="18" rx="9" fill="#000000"/>
    <g fill="#ffffff">
      <rect x="200" y="92" width="2.5" height="3" rx="0.5"/>
      <rect x="204" y="90" width="2.5" height="5" rx="0.5"/>
      <rect x="208" y="88" width="2.5" height="7" rx="0.5"/>
      <rect x="212" y="86" width="2.5" height="9" rx="0.5"/>
      <rect x="224" y="88" width="12" height="5" rx="1"/>
    </g>
    <rect x="221.75" y="85.75" width="16.5" height="9.5" rx="2.5" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Cabeçalho do app -->
    <use href="#pin" x="42" y="108" width="20" height="20" color="#3be558"/>
    <text x="66" y="121" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.5">FARBO</text>
    <text x="66" y="131" font-size="5.6" font-weight="700" fill="#3be558" letter-spacing="1.9">RASTREADORES</text>
    <g stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round">
      <path d="M222 113h16"/>
      <path d="M222 119h16"/>
      <path d="M222 125h16"/>
    </g>

    <!-- Mapa do app -->
    <rect x="32" y="142" width="220" height="240" fill="#0e1611"/>
    <rect x="180" y="286" width="46" height="34" rx="8" fill="#3be558" fill-opacity="0.08"/>
    <g fill="none" stroke="#17221a" stroke-width="4" stroke-linecap="round">
      <path d="M32 200H252"/>
      <path d="M32 330c88-5 148 10 220-10"/>
      <path d="M78 142v240"/>
      <path d="M168 142c4 78-8 158 2 240"/>
    </g>
    <g fill="none" stroke="#202d24" stroke-width="9" stroke-linecap="round">
      <path d="M32 262c68-10 138 18 220-24"/>
      <path d="M122 142c-6 78 26 158 14 240"/>
      <path d="M214 142c-6 78 12 158 24 240"/>
    </g>
    <g fill="none" stroke="#2d3b31" stroke-width="1" stroke-dasharray="4 5">
      <path d="M32 262c68-10 138 18 220-24"/>
      <path d="M122 142c-6 78 26 158 14 240"/>
      <path d="M214 142c-6 78 12 158 24 240"/>
    </g>
    <text x="40" y="254" font-size="6.5" fill="#46554b" transform="rotate(-4 40 254)">Av. Paulista</text>

    <path d="M58 332c26-4 50 0 80-6 4-22-2-42-4-62 28 2 54 0 82-14-2-18-4-34-4-50" fill="none" stroke="#3be558" stroke-width="10" stroke-opacity="0.25" filter="url(#glow)"/>
    <path d="M58 332c26-4 50 0 80-6 4-22-2-42-4-62 28 2 54 0 82-14-2-18-4-34-4-50" fill="none" stroke="#3be558" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="332" r="4.5" fill="#0b110d" stroke="#3be558" stroke-width="2"/>

    <circle class="pulse" cx="212" cy="200" r="22" fill="#3be558" fill-opacity="0.3"/>
    <circle class="pulse delay" cx="212" cy="200" r="22" fill="#3be558" fill-opacity="0.3"/>
    <circle cx="212" cy="200" r="12" fill="#3be558" stroke="#0b110d" stroke-width="2.5"/>
    <use href="#moto" x="205" y="193" width="14" height="14" color="#060907" stroke-width="2.4"/>

    <rect x="184" y="160" width="56" height="18" rx="9" fill="#060907" stroke="#3be558" stroke-opacity="0.5"/>
    <text x="212" y="172" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">80 km/h</text>

    <rect x="42" y="152" width="58" height="20" rx="10" fill="#060907" fill-opacity="0.85" stroke="#3be558" stroke-opacity="0.4"/>
    <circle cx="54" cy="162" r="3" fill="#3be558"/>
    <text x="62" y="165" font-size="8.5" font-weight="600" fill="#ffffff">Ao vivo</text>

    <!-- Painel inferior do app -->
    <rect x="32" y="360" width="220" height="210" rx="22" fill="#121a14"/>
    <rect x="32.5" y="360.5" width="219" height="209" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="127" y="368" width="30" height="4" rx="2" fill="#2c372f"/>

    <circle cx="62" cy="398" r="16" fill="#3be558" fill-opacity="0.12" stroke="#3be558" stroke-opacity="0.6" stroke-width="1.2"/>
    <use href="#moto" x="53" y="389" width="18" height="18" color="#3be558"/>
    <text x="86" y="395" font-size="12" font-weight="700" fill="#ffffff">Honda CB 500</text>
    <circle cx="89" cy="408" r="3" fill="#3be558"/>
    <text x="96" y="411" font-size="9" font-weight="600" fill="#3be558">Em movimento</text>

    <rect x="44" y="424" width="94" height="44" rx="10" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="54" y="440" font-size="7.5" fill="#64748b">Velocidade</text>
    <text x="54" y="458" font-size="13" font-weight="800" fill="#ffffff">80 km/h</text>
    <rect x="146" y="424" width="94" height="44" rx="10" fill="#0b110d" stroke="#ffffff" stroke-opacity="0.05"/>
    <text x="156" y="440" font-size="7.5" fill="#64748b">Ignição</text>
    <text x="156" y="458" font-size="13" font-weight="800" fill="#3be558">Ligada</text>

    <use href="#pin" x="44" y="477" width="11" height="11" color="#94a3b8"/>
    <text x="59" y="486" font-size="8.5" fill="#94a3b8">Av. Paulista, São Paulo - SP</text>

    <rect x="44" y="498" width="196" height="32" rx="16" fill="#3be558"/>
    <text x="142" y="518" font-size="10" font-weight="800" fill="#060907" text-anchor="middle">Ver histórico de rotas</text>

    <rect x="107" y="543" width="70" height="4" rx="2" fill="#3a453d"/>
  </g>

  <!-- Notificação -->
  <g filter="url(#shadow)">
    <rect x="286" y="470" width="258" height="64" rx="16" fill="#121b15"/>
  </g>
  <rect x="286.5" y="470.5" width="257" height="63" rx="15.5" fill="none" stroke="#3be558" stroke-opacity="0.35"/>
  <circle cx="316" cy="502" r="16" fill="#3be558" fill-opacity="0.14"/>
  <use href="#bell" x="307" y="493" width="18" height="18" color="#3be558"/>
  <text x="342" y="497" font-size="11" font-weight="700" fill="#ffffff">Alerta de movimento</text>
  <text x="342" y="513" font-size="8.5" fill="#94a3b8">Honda CB 500 saiu da cerca virtual</text>
  <text x="532" y="490" font-size="7.5" fill="#64748b" text-anchor="end">agora</text>
</svg>
