# HSTS só faz sentido atrás de HTTPS (terminado no proxy da frente). Valor
# vazio faz o nginx omitir o cabeçalho.
map $http_x_forwarded_proto $hsts {
    https   "max-age=31536000";
    default "";
}

# Log sem a query string: o WebSocket leva o token de acesso na URL.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # Não anuncia a versão do nginx nas respostas e páginas de erro.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    # Os arquivos com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Source maps ficam só na imagem de build: o código-fonte não é público.
    location ~* \.map$ {
        return 404;
    }

    # O index nunca é cacheado, senão o deploy novo não aparece.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }

    # API e WebSocket vão para o backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        access_log /var/log/nginx/access.log noquery;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A conexão fica aberta: o timeout precisa ser longo.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: qualquer rota desconhecida devolve o index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
