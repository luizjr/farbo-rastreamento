    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060907" />
    <meta name="description" content="Acompanhe seus veículos em tempo real, receba alertas no celular e pague suas faturas." />
    <title>Farbo Rastreadores</title>

    <!-- App instalável (PWA) -->
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/app/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Barra de status preta (e não "black-translucent"). No iOS 26, com a
         translúcida, o app instalado é desenhado a partir do topo da tela mas
         com a altura "tela menos a barra de status": os 59pt de baixo ficam
         pretos e cortam as abas. Com "black" a área do app começa abaixo da
         barra de status e vai até o fim da tela. O iPhone guarda esse valor ao
         "Adicionar à Tela de Início": mudar exige reinstalar o ícone. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Farbo" />
    <!-- Sem isso o iPhone transforma IMEI, placa e valores em link de telefone. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
